name: Build and publish release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and all release tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Prepare release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing repository secret: $secret_name"
              exit 1
            fi
          done

          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/mifitnessadaway.keystore
          cat > keystore/signing.properties <<EOF
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Calculate next release version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag=""
          latest_major=0
          latest_minor=0
          latest_patch=0
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              latest_tag="$tag"
              latest_major="${BASH_REMATCH[1]}"
              latest_minor="${BASH_REMATCH[2]}"
              latest_patch="${BASH_REMATCH[3]}"
              break
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)

          if [[ -z "$latest_tag" ]]; then
            echo "No formal release tag matching v<major>.<minor>.<patch> was found." >&2
            exit 1
          fi

          next_patch=$((10#$latest_patch + 1))
          next_tag="v${latest_major}.${latest_minor}.${next_patch}"
          next_version_name="${latest_major}.${latest_minor}.${next_patch}"

          # Keep versionCode decimal and monotonic for semantic-version releases.
          next_version_code=$((10#$latest_major * 10000 + 10#$latest_minor * 100 + 10#$next_patch))
          if git rev-parse --verify --quiet "refs/tags/$next_tag" >/dev/null; then
            echo "Release tag $next_tag already exists; aborting." >&2
            exit 1
          fi

          commit_sha="$(git rev-parse HEAD)"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${commit_sha}"

          {
            echo "RELEASE_TAG=$next_tag"
            echo "VERSION_NAME=$next_version_name"
            echo "VERSION_CODE=$next_version_code"
            echo "COMMIT_SHA=$commit_sha"
            echo "COMMIT_URL=$commit_url"
          } >> "$GITHUB_ENV"

          echo "Latest release: ${latest_tag:-none}"
          echo "Next release: $next_tag (versionCode $next_version_code)"

      - name: Build release APK
        run: >-
          gradle --no-daemon --console=plain assembleRelease
          -PversionName="$VERSION_NAME"
          -PversionCode="$VERSION_CODE"

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## 更新内容

          [查看本次提交内容]($COMMIT_URL)
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          "app/build/outputs/apk/release/app-release.apk"
          --target "$COMMIT_SHA"
          --title "$RELEASE_TAG"
          --notes-file release-notes.md
